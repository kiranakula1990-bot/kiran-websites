<style>
  :root{
    --bleed-1:#0a1f38; --bleed-2:#06121f; --lime:#e6ef62; --ink:#eaf1fb;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{
    min-height:100svh;
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(130% 90% at 50% 42%, var(--bleed-1) 0%, var(--bleed-2) 70%);
    overflow:hidden;
  }

  /* full-viewport stage, video is the hero */
  .stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  }
  .frame{
    position:relative; line-height:0;
    max-width:min(100%, calc((100svh - 28px) * 16 / 9));
    width:100%;
    border-radius:14px; overflow:hidden;
    box-shadow:0 30px 80px -24px rgba(0,0,0,.75), 0 0 0 1px rgba(230,239,98,.14);
  }
  video{
    display:block; width:100%; height:auto;
    max-height:calc(100svh - 28px);
    background:#000; aspect-ratio:16/9; object-fit:contain;
  }

  /* floating chrome */
  .logo{
    position:fixed; top:max(16px, env(safe-area-inset-top)); left:16px; z-index:3;
    background:#fff; border-radius:11px; padding:8px 12px;
    box-shadow:0 8px 22px -8px rgba(0,0,0,.55);
  }
  .logo img{height:22px; width:auto; display:block}

  .dl{
    position:fixed; top:max(16px, env(safe-area-inset-top)); right:16px; z-index:3;
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    transition:color .15s ease, background .15s ease, transform .12s ease;
  }
  .dl:hover{color:#06121f; background:var(--lime); border-color:var(--lime)}
  .dl:active{transform:scale(.94)}
  .dl svg{width:20px; height:20px}

  /* play affordance */
  .play{
    position:absolute; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    border:0; margin:0; padding:0; cursor:pointer;
    background:radial-gradient(60% 60% at 50% 50%, rgba(6,18,31,.18), rgba(6,18,31,.42));
    -webkit-tap-highlight-color:transparent;
  }
  .play .ring{
    width:clamp(76px,16vw,104px); aspect-ratio:1; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,31,56,.55);
    box-shadow:0 0 0 3px var(--lime), 0 12px 34px -8px rgba(0,0,0,.6);
    transition:transform .14s ease, box-shadow .2s ease;
  }
  .play:hover .ring{transform:scale(1.05); box-shadow:0 0 0 4px var(--lime), 0 16px 40px -8px rgba(0,0,0,.65)}
  .play:active .ring{transform:scale(.97)}
  .play .ring::before{
    content:""; display:block;
    width:0; height:0; margin-left:6px;
    border-left:clamp(22px,5vw,30px) solid var(--lime);
    border-top:clamp(14px,3.2vw,19px) solid transparent;
    border-bottom:clamp(14px,3.2vw,19px) solid transparent;
  }
  .play:hover .ring{background:rgba(10,31,56,.72)}
  .play.hidden{display:none}

  @media (prefers-reduced-motion:reduce){
    .play .ring, .dl{transition:none}
  }

  :focus-visible{outline:3px solid var(--lime); outline-offset:3px}
</style>
</head>
<body>
  <a class="logo" href="https://evochem.co.in/" aria-label="Evochem home">
    <img src="/assets/image/logo.png" alt="Evochem">
  </a>

  <a class="dl" id="dl" href="/assets/videos/evochem-720p.mp4" download
     aria-label="Download video" title="Download video">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
    </svg>
  </a>

  <div class="stage">
    <div class="frame">
      <video id="player" playsinline preload="metadata"
             poster="/assets/videos/evochem-poster.jpg"></video>
      <button class="play" id="play" type="button" aria-label="Play video">
        <span class="ring" aria-hidden="true"></span>
      </button>
    </div>
  </div>

<script>
  (function(){
    var v = document.getElementById('player');
    var dl = document.getElementById('dl');
    var play = document.getElementById('play');
    var SRC = { hd:'/assets/videos/evochem-1080p.mp4', sd:'/assets/videos/evochem-720p.mp4' };

    // Smaller file on phones / constrained networks.
    var small = Math.min(window.innerWidth, window.screen ? window.screen.width : 9999) <= 820;
    try {
      var c = navigator.connection;
      if (c && (c.saveData || /(^|-)2g$/.test(c.effectiveType) || c.effectiveType === '3g')) small = true;
    } catch(e){}
    var chosen = small ? SRC.sd : SRC.hd;
    v.src = chosen; dl.href = chosen; v.load();

    function start(){
      play.classList.add('hidden');
      v.setAttribute('controls','');          // hand over to native controls once playing
      v.play().catch(function(){ v.muted = true; v.play(); }); // fall back to muted if sound is blocked
    }
    play.addEventListener('click', start);
    v.addEventListener('play', function(){ play.classList.add('hidden'); v.setAttribute('controls',''); });
  })();
</script>
</body>
</html>
