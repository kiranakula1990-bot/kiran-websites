<style>
  :root{
    --navy:#133c6b; --navy-2:#0d2a4c; --blue:#1767a6; --lime:#e6ef62; --ink:#eaf1fb;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100svh;
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(23,103,166,.45), transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    background-attachment:fixed;
    display:flex; flex-direction:column; align-items:center;
    padding:clamp(18px,4vw,40px) 16px calc(28px + env(safe-area-inset-bottom));
  }
  .brand{display:flex; align-items:center; gap:12px; margin:4px 0 clamp(14px,3vw,24px)}
  .brand img{height:30px; width:auto; display:block;
    background:#fff; padding:9px 14px; border-radius:12px;
    box-shadow:0 6px 18px -6px rgba(0,0,0,.45)}
  .brand .fallback{font-weight:800; letter-spacing:.5px; font-size:22px; color:#fff;
    background:#fff; color:var(--navy); padding:8px 14px; border-radius:12px}
  .wrap{width:100%; max-width:860px}
  h1{
    font-size:clamp(20px,5.2vw,30px); font-weight:800; line-height:1.15;
    margin:0 0 6px; text-align:center; color:#fff;
  }
  .sub{margin:0 auto clamp(16px,3.5vw,26px); max-width:34ch; text-align:center;
    color:#b9c9de; font-size:clamp(13px,3.4vw,15px); line-height:1.5}
  .stage{
    position:relative; border-radius:18px; overflow:hidden;
    background:#000; aspect-ratio:16/9;
    box-shadow:0 18px 50px -12px rgba(0,0,0,.6), 0 0 0 1px rgba(230,239,98,.22);
  }
  video{width:100%; height:100%; display:block; background:#000}
  .meta{display:flex; align-items:center; justify-content:center; gap:14px;
    margin-top:16px; flex-wrap:wrap}
  .dl{
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    color:var(--navy); background:var(--lime); font-weight:700; font-size:14px;
    padding:10px 16px; border-radius:999px; transition:transform .12s ease, filter .12s ease;
  }
  .dl:active{transform:translateY(1px)} .dl:hover{filter:brightness(1.05)}
  .foot{margin-top:22px; text-align:center; color:#88a0bd; font-size:12px}
  .foot a{color:#b9c9de; text-decoration:none}
  .foot a:hover{text-decoration:underline}
</style>

<body>
  <div class="brand">
    <img src="/assets/image/logo.png" alt="Evochem"
         onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
    <span class="fallback" style="display:none">EVOCHEM</span>
  </div>

  <div class="wrap">
    <h1>Watch the Evochem video</h1>
    <p class="sub">Tap play to watch. Best experienced with sound on.</p>

    <div class="stage">
      <video id="player" controls playsinline preload="metadata"
             poster="/assets/videos/evochem-poster.jpg"></video>
    </div>

    <div class="meta">
      <a class="dl" id="dl" href="/assets/videos/evochem-720p.mp4" download>
        ⬇ Download video
      </a>
    </div>

    <p class="foot">© Evochem · <a href="https://evochem.co.in/">evochem.co.in</a></p>
  </div>

<script>
  (function(){
    var v = document.getElementById('player');
    var dl = document.getElementById('dl');
    var SRC = {
      hd: '/assets/videos/evochem-1080p.mp4',
      sd: '/assets/videos/evochem-720p.mp4'
    };
    // Pick the mobile (smaller) file on small screens or constrained networks.
    var small = Math.min(window.innerWidth, window.screen ? window.screen.width : 9999) <= 820;
    try {
      var c = navigator.connection;
      if (c && (c.saveData || /(^|-)2g$/.test(c.effectiveType) || c.effectiveType === '3g')) small = true;
    } catch(e){}
    var chosen = small ? SRC.sd : SRC.hd;
    v.src = chosen;
    dl.href = chosen;
    v.load();
  })();
</script>
</body>
