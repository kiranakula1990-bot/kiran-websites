<div class="phoneview_menu">

    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
      <div class="offcanvas-header">
          <a routerLink="/" class="logo-imgphone" aria-label="Evochem home" data-bs-dismiss="offcanvas">
              <img src="assets/image/logo.png" alt="Evochem" style="width: 150px;">
          </a>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close menu"></button>
      </div>
      <div class="offcanvas-body">
         <div class="div-menulink-phone">
          <ul>
              <li *ngFor="let menu of menus"><a [routerLink]="menu.path" class="mobile-section-label mobile-section-link" data-bs-dismiss="offcanvas">{{ menu.label }}</a>
                <div class="div-ulsec" *ngFor="let link of menu.links">
                    <a [routerLink]="link.path" class="systumm-hai caret mobile-nav-btn" data-bs-dismiss="offcanvas">
                        <span class="div-name"><span>{{ link.label }}</span></span>
                    </a>
                </div>
              </li>
              <li><a routerLink="/case-studies/" routerLinkActive="is-active" data-bs-dismiss="offcanvas">Case studies</a></li>
              <li><a routerLink="/resources/" routerLinkActive="is-active" data-bs-dismiss="offcanvas">Articles</a></li>
              <li><a routerLink="/" fragment="aboutus" data-bs-dismiss="offcanvas">About us</a></li>
              <li><a routerLink="/contactus" routerLinkActive="is-active" data-bs-dismiss="offcanvas">Contact us</a></li>
          </ul>
         </div>
      </div>
    </div>
</div>

<div class="main-sectionapp container">
    <div class="main-header">
        <div class="sectionfixed">
            <a routerLink="/" class="imagelogo" aria-label="Evochem home">
                <img src="assets/image/logo.png" alt="Evochem">
            </a>
            <nav class="diVlink" aria-label="Main">
                <ul>
                    <li *ngFor="let menu of menus" class="navWrapper nav-dd" [class.open]="openMenu === menu.key" (mouseleave)="close()">
                        <button type="button" class="menuItem" aria-haspopup="true"
                                [attr.aria-expanded]="openMenu === menu.key" (click)="toggle(menu.key)">{{ menu.label }}</button>
                        <div class="nav-dd__panel">
                            <ul class="nav-dd__list">
                                <li *ngFor="let link of menu.links"><a [routerLink]="link.path" class="nav-dd__link" (click)="close()">{{ link.label }}</a></li>
                            </ul>
                            <a [routerLink]="menu.path" class="nav-dd__all" (click)="close()">{{ menu.allLabel }} →</a>
                        </div>
                    </li>
                    <li><a routerLink="/case-studies/" routerLinkActive="is-active">Case studies</a></li>
                    <li><a routerLink="/resources/" routerLinkActive="is-active">Articles</a></li>
                    <li><a routerLink="/" fragment="aboutus">About</a></li>
                    <li><a routerLink="/contactus" routerLinkActive="is-active" class="nav-cta">Contact us</a></li>
                </ul>
            </nav>
            <button type="button" class="menuba-r" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample" aria-label="Open menu">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
